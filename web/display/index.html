<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Song</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F3A4;</text></svg>">
  <link rel="stylesheet" href="../style/display.css">
</head>
<body>

  <button id="fullscreen-btn" title="Enter fullscreen">⛶</button>

  <!-- Normal display — shown when session ID is valid -->
  <div class="display-page" id="display-page">
    <div class="logo">🎤</div>
    <h1 class="heading">Make a Request!</h1>
    <p class="sub">Scan the code to pick a karaoke song</p>
    <div class="qr-card" id="qr-card">
      <img id="qr-img" class="qr-img" src="" alt="Scan to request a song">
    </div>
    <p class="url-pill" id="url-pill"></p>
  </div>

  <!-- Error — shown when the link is invalid or session has expired -->
  <div class="display-page" id="error-page" hidden>
    <div class="logo">😕</div>
    <h1 class="heading" style="font-size:clamp(1.5rem,5vw,2.5rem)">Invalid Link</h1>
    <p class="sub">This display link is invalid or the session has expired.<br>Ask the host for a valid link.</p>
  </div>

  <script src="../script/display.js"></script>
</body>
</html>
