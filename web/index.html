<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Browser</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F3A4;</text></svg>">
  <link rel="stylesheet" href="style/index.css">
</head>
<body>
  <div class="page">

    <header>
      <div class="logo">🎤</div>
      <h1>Karaoke Browser</h1>
      <p class="subtitle">Your karaoke night command center</p>
    </header>

    <!-- Login form (shown in AUTH_TOKEN mode when not authenticated) -->
    <div id="login-section" class="card hidden">
      <h2>This Karaoke Room is Password Protected</h2>
      <p class="hint">Enter the password to access the player and controller.</p>
      <form id="token-form" autocomplete="off">
        <input id="token-input" type="password" placeholder="Enter password…"
               autocomplete="off" spellcheck="false">
        <button type="submit" class="btn-primary">Log In</button>
      </form>
      <div id="token-error" class="error hidden">Invalid password — please try again.</div>
    </div>

    <!-- Create a new room -->
    <div id="create-section" class="card hidden">
      <button id="create-btn" class="btn-primary">Start Karaoke Night</button>
      <div id="create-error" class="error hidden">Could not create room — please try again.</div>
    </div>

    <!-- Room links (shown after creation) -->
    <div id="room-links" class="hidden">
      <div class="links-grid">
        <button id="controller-btn" class="link-card">
          <div class="link-icon">🎤</div>
          <div class="link-title">Controller</div>
          <div class="link-desc">Add songs, manage the queue, and control playback</div>
        </button>
        <button id="player-btn" class="link-card">
          <div class="link-icon">🎬</div>
          <div class="link-title">Player</div>
          <div class="link-desc">Fullscreen video player — display on screen or capture in OBS</div>
        </button>
      </div>
      <button id="new-room-btn" class="btn-ghost hidden">Start a new room</button>
      <button id="logout-btn" class="btn-ghost hidden">Log out</button>
    </div>

  </div>

  <script src="script/index.js"></script>
</body>
</html>
