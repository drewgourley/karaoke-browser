<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Request</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F3A4;</text></svg>">
  <link rel="stylesheet" href="../style/request.css">
</head>
<body>
  <div class="page">

    <header>
      <div class="logo">🎤</div>
      <h1>Song Request</h1>
      <p class="subtitle">Ask the DJ to play your song</p>
    </header>

    <!-- Shown when the link has no session ID -->
    <div id="invalid-section" class="card hidden">
      <p class="hint">This request link is invalid. Please ask the host for a valid link.</p>
    </div>

    <!-- Request form -->
    <div id="form-section" class="card hidden">
      <form id="request-form" autocomplete="off" novalidate>
        <div class="field">
          <label for="request-name">Your name</label>
          <input id="request-name" type="text" placeholder="Your name"
                 autocomplete="given-name" maxlength="120">
        </div>
        <div class="field">
          <label for="request-artist">Artist</label>
          <input id="request-artist" type="text" placeholder="Artist name"
                 autocomplete="off" maxlength="120">
        </div>
        <div class="field">
          <label for="request-title">Song title <span class="required">*</span></label>
          <input id="request-title" type="text" placeholder="Song title"
                 autocomplete="off" maxlength="120">
        </div>
        <button type="submit" id="submit-btn" class="btn-primary" disabled>Send Request</button>
      </form>
      <div id="ws-error" class="error hidden">Connection lost — please reload the page.</div>
    </div>

    <!-- Success confirmation -->
    <div id="success-section" class="success hidden">
      <div class="success-icon">🎤</div>
      <div class="success-title">Request Sent!</div>
      <div class="success-sub">The DJ has your request.</div>
    </div>

  </div>

  <script src="../script/request.js"></script>
</body>
</html>
