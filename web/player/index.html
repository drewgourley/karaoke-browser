<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Karaoke Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Carter+One&family=Chango&family=Domine:wght@400;700&family=Great+Vibes&family=Instrument+Serif&family=MonteCarlo&family=Oswald:wght@200;400;600&family=Raleway:wght@100;400;800&family=SN+Pro:wght@200;400;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F3AC;</text></svg>">
  <link rel="stylesheet" href="../style/player.css">
</head>
<body>
  <div id="idle">
    <div class="standby-bg" id="standby-bg"></div>
    <div class="slate-content">
      <div id="standby-title-el" class="standby-title">Karaoke Browser</div>
      <div id="standby-subtitle-el" class="standby-subtitle">Your karaoke night command center</div>
    </div>
    <div class="slate-crowd-qr">
      <div class="scq-logo">🎤</div>
      <h2 class="scq-heading">Make a Request!</h2>
      <p class="scq-sub">Scan the code to pick a karaoke song</p>
      <div class="scq-card"><img class="scq-img" src="" alt="Scan to request a song"></div>
      <p class="scq-url"></p>
    </div>
  </div>
  <div id="yt-player"></div>
  <div id="standby-player"></div>
  <div id="embed-error">
    <img id="embed-thumb" src="" alt="">
    <div id="embed-title"></div>
    <div id="embed-sub">Playing on YouTube &mdash; check the controller</div>
  </div>
  <div id="singer-slate">
    <div class="slate-content">
      <div id="slate-eyebrow">Now Singing</div>
      <div id="slate-singer"></div>
      <div id="slate-title"></div>
    </div>
    <div class="slate-crowd-qr">
      <div class="scq-logo">🎤</div>
      <h2 class="scq-heading">Make a Request!</h2>
      <p class="scq-sub">Scan the code to pick a karaoke song</p>
      <div class="scq-card"><img class="scq-img" src="" alt="Scan to request a song"></div>
      <p class="scq-url"></p>
    </div>
  </div>
  <div id="start-gate">
    <div id="start-gate-icon">🎤</div>
    <div id="start-gate-label" hidden>Tap to begin</div>
    <div id="gate-status">
      <div class="gate-badge">
        <div class="gate-dot on"></div>
        <span>Player</span>
      </div>
      <div class="gate-badge" id="gate-controller-badge">
        <div class="gate-dot" id="gate-controller-dot"></div>
        <span>Controller</span>
      </div>
    </div>
    <button id="gate-open-controller" hidden>🎤 Open Controller</button>
  </div>
  <button id="fullscreen-btn" title="Enter fullscreen">⛶</button>
  <!-- Shown when another window takes over the player slot -->
  <div id="displaced-banner" hidden>
    <span>⚠️ This player was replaced by another window.</span>
    <button id="displaced-reclaim-btn">Take back control</button>
  </div>
  <script src="../script/player.js"></script>
</body>
</html>
